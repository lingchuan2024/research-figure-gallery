   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667d8a" x="25.2" y="59.47125" transform="rotate(-0 25.2 59.47125)">Structural redraw · a gated handoff separates evidence collection from report writing</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #667d8a" x="460.8" y="549.683437" transform="rotate(-0 460.8 549.683437)">FS-Researcher, arXiv:2602.01566v2 · Fig. 2 / §§2.1–2.3 · Simplified structure; no concurrent Writer web browsing.</text>
   </g>
   <g id="text_4">
