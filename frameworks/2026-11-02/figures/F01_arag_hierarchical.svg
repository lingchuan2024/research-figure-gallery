    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233747" x="25.2" y="32.452812" transform="rotate(-0 25.2 32.452812)">A-RAG | A hierarchy the agent can choose</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667d8a" x="25.2" y="59.47125" transform="rotate(-0 25.2 59.47125)">Structural redraw · three retrieval interfaces, one tool per reasoning step</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #667d8a" x="460.8" y="549.683437" transform="rotate(-0 460.8 549.683437)">A-RAG, arXiv:2602.03442v1 · Fig. 3 / §§3.1–3.3 · Simplified module relationships; not the authors' artwork.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233747" x="408.96" y="115.463125" transform="rotate(-0 408.96 115.463125)">Retrieval interfaces</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #233747" x="682.56" y="115.463125" transform="rotate(-0 682.56 115.463125)">Corpus views</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #233747" x="79.2" y="198.263125" transform="rotate(-0 79.2 198.263125)">Question</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #233747" x="257.4" y="171.120469" transform="rotate(-0 257.4 171.120469)">Reasoning agent</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #5c7280" transform="translate(184.545 214.788703)">Think → choose one tool</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #5c7280" transform="translate(189.861563 229.593797)">Observe → think again</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #233747" x="257.4" y="401.303125" transform="rotate(-0 257.4 401.303125)">Final answer</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5c7280" x="257.4" y="423.803312" transform="rotate(-0 257.4 423.803312)">When ready / at step cap</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #233747" x="513" y="163.648438" transform="rotate(-0 513 163.648438)">Keyword search</text>
