name: Rebuild scientific figure gallery
on: [push, pull_request, workflow_dispatch]
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/build_gallery.py --keep-existing-images
      - uses: actions/upload-artifact@v4
        with:
          name: figure-gallery
          path: |
            assets/
            docs/gallery_overview.png
            docs/gallery_with_frameworks.png
            frameworks/2026-11-02/
            paper_expansion/2026-11-01/figures/
            paper_expansion/2026-11-01/new_figures_overview.png
            verification.json
