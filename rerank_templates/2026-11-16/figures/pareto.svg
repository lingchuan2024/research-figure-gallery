  <g id="text_16">
   <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243746" x="35.591063" y="19.3575" transform="rotate(-0 35.591063 19.3575)">Observed quality–cost trade-offs</text>
  </g>
  <g id="text_17">
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #5c707b" transform="translate(161.24625 405.36495)">SYNTHETIC DEMO - not experimental results</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #5c707b" transform="translate(15.405188 413.427375)">Filled double-ring points: nondominated observed means (lower cost, higher quality); hollow: dominated. Bars: 95% marginal</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #5c707b" transform="translate(7.2 421.4898)">percentile bootstrap CIs, resampling the same questions within each benchmark. All methods and both coordinates use the same</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'; fill: #5c707b" transform="translate(35.004938 429.552225)">retained question cohort. No connecting frontier is drawn; nondominance does not establish statistical superiority.</text>
  </g>
 </g>
